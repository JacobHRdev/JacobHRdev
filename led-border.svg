<svg width="100%" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="chaseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bbbbbb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="160" rx="22" fill="#050505"/>

  <rect x="5" y="5" width="890" height="150" rx="18"
        fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <rect x="5" y="5" width="890" height="150" rx="18"
        fill="none" stroke="url(#chaseGradient)" stroke-width="3"
        stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="140 1900" pathLength="2040">
    <animate attributeName="stroke-dashoffset"
             from="2040" to="0"
             dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="82" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="4"
        fill="url(#textFade)">
    JACOB HERRERA RODRIGUEZ
  </text>

  <text x="450" y="114" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="3"
        fill="#8a8a8a">
    COMPUTER ENGINEERING STUDENT · SIMULATION &amp; SOFTWARE DEV
  </text>
</svg>
