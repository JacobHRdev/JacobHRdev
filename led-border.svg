<svg width="100%" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="chaseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F8ACB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fc3f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1F8ACB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chaseGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fdcff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="180" rx="22" fill="#050505"/>

  <rect x="5" y="5" width="890" height="170" rx="18"
        fill="none" stroke="#232323" stroke-width="2"/>

  <rect x="5" y="5" width="890" height="170" rx="18"
        fill="none" stroke="url(#chaseGradient)" stroke-width="3"
        stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="140 2040" pathLength="2180">
    <animate attributeName="stroke-dashoffset"
             from="2180" to="0"
             dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="5" y="5" width="890" height="170" rx="18"
        fill="none" stroke="url(#chaseGradient2)" stroke-width="3"
        stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="140 2040" pathLength="2180">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-2180"
             dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="76" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="4"
        fill="url(#textFade)">
    JACOB HERRERA RODRIGUEZ
  </text>

  <text x="450" y="110" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="14.5" letter-spacing="2.5"
        fill="#8a8a8a">
    COMPUTER ENGINEERING STUDENT
  </text>

  <text x="450" y="138" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="1.5"
        fill="#5f7a8c">
    INTERACTIVE SIMULATIONS · DESKTOP TOOLS · ALGORITHMIC SOLUTIONS
  </text>
</svg>
